# Wilson-Cowan network. Time in seconds.
#
#   tau_e dE/dt = -E + (1 - E) S_e(c1 E - c2 I + P + c5 sum_j C_ij E_j) + tau_e sigma nu
#   tau_i dI/dt = -I + (1 - I) S_i(c3 E - c4 I + Q)                    + tau_i sigma nu
#   S_k(z) = 1 / (1 + exp(-a_k (z - theta_k)))      (non-shifted logistic, generation.md §3)
#
# The original DELSSOME did not implement Wilson-Cowan, so there is no published fit to
# reproduce: this card is a compile-and-behaviour check only. The constants are the classic
# Wilson & Cowan (1972) values, chosen as illustrative, not fitted:
#   c2 = 12, c3 = 15, c4 = 3, a_e = 1.3, theta_e = 4, a_i = 2, theta_i = 3.7, Q = 0,
#   tau_e = tau_i = 10 ms
#
# Canonical form: logistic(u) with u_E = a_e (c1 E - c2 I + P - theta_e + c5 sum C E),
# u_I = a_i (c3 E - c4 I + Q - theta_i); dividing by tau gives L = diag(1/tau_e, 1/tau_i)
# and gamma = 1/tau. The noise is written directly as sigma nu on dx/dt.
#
# Card parameters vs the equations above (generation.md §4 triple: c1, P, sigma; c5):
#   c1    = c1              (regional, scale a_e)
#   P     = P - theta_e     (regional, scale a_e)   <- shifted by theta_e = 4
#   sigma = sigma           (regional)
#   c5    = c5              (global, scale a_e)
# P = 3, K = 1.
name: wilson_cowan
states: [E, I]
parameters:
  - {name: c1, scope: regional}
  - {name: P, scope: regional}
  - {name: sigma, scope: regional}
  - {name: c5, scope: global}
linear:
  - [100.0, null]                            # 1 / tau_e
  - [null, 100.0]                            # 1 / tau_i
bias: [null, null]
nonlinear:
  - gain: 100.0                              # 1 / tau_e
    gate: {kind: one_minus_self}
    transfer: logistic
    weights:
      - {param: c1, scale: 1.3}              # a_e
      - -15.6                                # -a_e c2
    drive: {param: P, scale: 1.3}            # a_e
  - gain: 100.0                              # 1 / tau_i
    gate: {kind: one_minus_self}
    transfer: logistic
    weights:
      - 30.0                                 # a_i c3
      - -6.0                                 # -a_i c4
    drive: -7.4                              # a_i (Q - theta_i)
noise: [{param: sigma}, {param: sigma}]
channels:
  - name: E
    source: [1.0, 0.0]
    transfer: identity
    diffusive: false
    gain: {param: c5, scale: 1.3}            # a_e
    into_input: [0]
    into_derivative: []
observable: {plus: 0, minus: null, observation: balloon_windkessel}
