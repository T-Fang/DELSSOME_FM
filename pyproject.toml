[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delssome-fm"
version = "0.0.1"
description = "Model-agnostic neural surrogate for fitting biophysical brain circuit models to fMRI"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "sympy",
    "jax",
    "equinox",
    "pycatch22",       # catch24 features of the corpus (sim/summary.py), added 2026-10-23
]

[project.optional-dependencies]
test = ["pytest"]
# Step 8 (network and training), decided 2026-10-14. Install torch first from the CUDA index
# (README "Install"), so pip does not pick a CPU or mismatched CUDA build.
train = ["torch", "lightning", "torchmetrics", "mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"delssome_fm.spec.reference" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cluster: needs the real data on the lab NAS; skipped when the data directory is absent",
]
