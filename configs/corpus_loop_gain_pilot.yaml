# Second pilot of the value prior (2026-11-10, user; generation.md §13), arm "loop_gain":
# the loop-ratio gain alone. A channel into the transfer input is sized by the loop it closes,
# gamma x G x SC row sum against the leak; channels at the derivative as in the first pilot.
# Otherwise as corpus_floor_relgain_pilot.yaml, with the same seed and floor: candidate i has
# the same equation structure, SC group, initial states and noise. Every field is required.

seed: 20261005
n_param_sets: 100
first_draw: 0                 # draws first_draw .. first_draw + n_param_sets - 1
batch_size: 100               # one model's draws per jit call

screen_draws: 4               # generation.md §6
screen_frames: 250            # 180 s at TR 0.72 s ("roughly three minutes")
screen_burn_in_frames: 50
flat_rel_sd: 1.0e-6           # flat: SD <= 1e-6 * |mean| in any region (decided 2026-10-12)

initial_state_scale: 0.1      # x0 ~ U(-0.1, 0.1) per simulation
fcd_store_stride: 100         # 100 levels: CDF at FCD = -0.98, -0.96, ..., 1.00 (decided 2026-10-05)

parameter_policy: sinh        # spec/sampler.py: Theta = each region's coefficient
gain_scope: model             # the coupling ratio is drawn once per model
rate_floor: 0.1               # 1/s: time constants <= 10 s, 14 of them in the 144-s burn-in
gain_prior: loop              # derivative: ratio x |L_vv|; input: ratio x |L_vv| / |gamma_v|, log10 ratio ~ U(-1, 2)
term_prior: flat              # gamma, w, I from the flat prior
level_prior: flat             # a draw's regional levels over the full range (sinh-policy option)
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/corpus_loop_gain_pilot
