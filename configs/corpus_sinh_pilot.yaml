# Pilot of the "sinh" parameter policy (2026-10-23, spec/sampler.py): constants, regional
# parameters and coupling gains all drawn in the signed log domain x = 1e-4 sinh(y). Each
# draw has, per regional parameter, a mean mu = 1e-4 sinh(z), z ~ U(-19.1, 19.1), and regions
# ~ N(mu, (kappa |mu|)^2) independently, kappa ~ U(0, 1); log10 G ~ U(-2, 2). Otherwise
# identical to configs/corpus_d10.yaml (same seed and streams, so candidate i has the same
# equations), to compare screen acceptance and validity candidate by candidate. Every field
# is required.

seed: 20261005
n_param_sets: 10
first_draw: 0                 # draws first_draw .. first_draw + n_param_sets - 1
batch_size: 10                # one model's draws per jit call

screen_draws: 4               # generation.md §6
screen_frames: 250            # 180 s at TR 0.72 s ("roughly three minutes")
screen_burn_in_frames: 50
flat_rel_sd: 1.0e-6           # flat: SD <= 1e-6 * |mean| in any region (decided 2026-10-12)

initial_state_scale: 0.1      # x0 ~ U(-0.1, 0.1) per simulation
fcd_store_stride: 100         # 100 levels: CDF at FCD = -0.98, -0.96, ..., 1.00 (decided 2026-10-05)

parameter_policy: sinh        # spec/sampler.py: Theta = each region's coefficient
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/corpus_sinh_pilot
