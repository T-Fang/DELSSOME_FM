# FC autoencoder (nn/fc_autoencoder.py, train/autoencoder.py; 2026-10-25): compresses the
# 2278 z-scored arctanh FC values of a draw into latent_dim numbers. Trained on every train
# row of the sinh store; the latent size is chosen by val reconstruction. Every field is
# required. A first attempt (lr 1e-3, no clipping, 60k steps) was unstable.

store_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/training_store_sinh
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/fc_autoencoder
seed: 20261025
latent_dim: 64
hidden: [1024, 512]     # encoder widths after the 2278 inputs; the decoder mirrors them
batch_size: 512
learning_rate: 3.0e-4
weight_decay: 1.0e-4
warmup_steps: 2000
max_steps: 200000       # ~25 passes over the ~4.0 M train rows (~300 steps/s on an H200)
val_rows: 50000
val_every_steps: 2500
num_workers: 8
precision: bf16-mixed
gradient_clip: 1.0      # without it, lr 1e-3 diverged (latent 128 at ~12k steps, 2026-10-25)
log_every_steps: 50
mlflow_tracking_uri: sqlite:////home/ftian/storage/projects/DELSSOME-FM/outputs/mlflow/mlflow.db
mlflow_artifact_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/mlflow/artifacts
mlflow_experiment: fc_autoencoder
