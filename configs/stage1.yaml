# Stage 1: pretrain the backbone on simulated summary statistics (architecture.md §5).
# Every field is required. Widths and depths follow architecture.md §1 and §4.

store_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/training_store
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/stage1
seed: 20261014

# network
d_model: 128            # d
d_template: 128         # d_t
template_layers: 4      # Graphormer layers (architecture.md leaves this open; choice)
backbone_layers: 4      # the original DELSSOME configuration
n_heads: 8
ffn_multiplier: 4
dropout: 0.0
fc_rank: 32             # k
max_distance: 16        # DAG shortest paths clipped here (longest in the corpus: see store)
max_degree: 16

# optimisation
batch_size: 256
edges_per_step: 256     # architecture.md §5.2: ~256 FC edges per step
learning_rate: 3.0e-4
weight_decay: 0.01
warmup_steps: 2000
max_steps: 200000       # ~6 passes over the ~8.3 M training rows
val_rows: 50000
val_every_steps: 5000
num_workers: 8
precision: bf16-mixed
gradient_clip: 1.0

# tracking: one SQLite database for all runs; view with
#   (log_every_steps: training metrics are logged every this many steps)
#   mlflow ui --backend-store-uri <mlflow_tracking_uri>
log_every_steps: 50
mlflow_tracking_uri: sqlite:////home/ftian/storage/projects/DELSSOME-FM/outputs/mlflow/mlflow.db
mlflow_experiment: stage1
