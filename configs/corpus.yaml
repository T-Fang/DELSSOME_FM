# Stage-1 synthetic corpus (generation.md §9: first pass of ~100,000 models x 100 parameter
# sets). Simulation settings come from configs/sim.yaml; the 64 training group SCs from
# configs/data.yaml. Every field is required.

seed: 20261005
n_param_sets: 100
first_draw: 0                 # draws first_draw .. first_draw + n_param_sets - 1
batch_size: 100               # one model's draws per jit call

screen_draws: 4               # generation.md §6
screen_frames: 250            # 180 s at TR 0.72 s ("roughly three minutes")
screen_burn_in_frames: 50
flat_rel_sd: 1.0e-6           # flat: SD <= 1e-6 * |mean| in any region (decided 2026-10-12)

initial_state_scale: 0.1      # x0 ~ U(-0.1, 0.1) per simulation
fcd_store_stride: 100         # 100 levels: CDF at FCD = -0.98, -0.96, ..., 1.00 (decided 2026-10-05)

parameter_policy: multiplier  # spec/sampler.py: Theta = multipliers of nominal constants
gain_scope: draw              # coupling gains drawn per draw (2026-11-04: corpora since use "model")
rate_floor: 0.0               # 1/s; no floor on L diagonals (sinh-policy option, 2026-11-10)
gain_prior: absolute          # gains not relative to the competing term (sinh-policy option)
term_prior: flat              # nonlinear terms: gamma, w, I from the flat prior (sinh-policy option)
level_prior: flat             # a draw's regional levels over the full range (sinh-policy option)
noise_prior: flat             # sigma's level over the full range (rest: relative to the resting state)
observable_rest: free         # no condition on the resting observable (bold: inside Balloon-Windkessel's range)
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/corpus
