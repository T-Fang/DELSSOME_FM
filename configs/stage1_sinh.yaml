# Stage 1 on the sinh-policy corpus (configs/corpus_sinh.yaml, training_data_sinh.yaml;
# 2026-10-25). The "original model" from now on: the concatenation pair-MLP FC head
# (pair_head mlp_concat, the best FC head of architecture.md §7.5) and the four summary-
# statistic groups, with the three cost terms (cost_loss, the default for variant tests
# from 2026-10-26). Variants switch catch24_loss, fc_net_loss, stat_loss, or use the latent FC
# head with a trained FC autoencoder (configs/fc_autoencoder.yaml). Every field is required.

store_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/training_store_sinh
output_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/stage1
seed: 20261014

# network
d_model: 128            # d
d_template: 128         # d_t
template_layers: 4      # Graphormer layers (architecture.md leaves this open; choice)
backbone_layers: 4      # the original DELSSOME configuration
n_heads: 8
ffn_multiplier: 4
dropout: 0.0
fc_rank: 32             # k
fc_offset: false        # per-draw offset b(h_CLS) in the FC head (nn/heads.py)
pair_head: mlp_concat     # bilinear | mlp_symmetric | mlp_concat (nn/heads.py)
pair_hidden: 128
cost_loss: true         # default for variants from 2026-10-26 (project lead); sinh_orig used false
fc_autoencoder: none     # "latent" pair head only: FC autoencoder checkpoint
stat_loss: true          # train on the summary statistics (regional, FC, FCD, FC moments)
catch24_loss: false      # train a catch24 head on the regions' catch24 features
fc_net_loss: false       # train a head on the Yeo-7 network FC (data/networks.py)
max_distance: 16        # DAG shortest paths clipped here (corpus max 25; 0.02% of pairs > 16)
max_degree: 16
token_scheme: region    # region | parameter (architecture.md §3.4, 2026-10-29)
embed_theta: true       # parameter tokens: theta through W_theta before the token MLP (false: raw)

# training data: the first train_models models, at most draws_per_model usable draws each
train_models: 100000
draws_per_model: 100
oversample_coupled: false  # true: coupled_share of the models are coupled
coupled_share: 0.5
coupled_threshold: 0.05     # coupled: model mean FC > this
coupled_draws_only: false  # true: train and validate on coupled draws only (2026-10-26)

# optimisation
batch_size: 256
edges_per_step: 256     # architecture.md §5.2: ~256 FC edges per step
learning_rate: 3.0e-4
weight_decay: 0.01
warmup_steps: 2000
max_steps: 200000       # ~13 passes over the ~3.9 M training rows of 100k models (batch 256)
val_rows: 50000
val_every_steps: 5000
final_eval_rows: 200000 # per split, evaluated on the best checkpoint after training
num_workers: 8
precision: bf16-mixed
gradient_clip: 1.0

# tracking: one SQLite database for all runs; view with
#   (log_every_steps: training metrics are logged every this many steps)
#   mlflow ui --backend-store-uri <mlflow_tracking_uri>
log_every_steps: 50
mlflow_tracking_uri: sqlite:////home/ftian/storage/projects/DELSSOME-FM/outputs/mlflow/mlflow.db
mlflow_artifact_dir: /home/ftian/storage/projects/DELSSOME-FM/outputs/mlflow/artifacts
mlflow_experiment: stage1_sinh
