# HCP-YA, Desikan-Killiany 68. Every field is required. See docs/data.md for where each
# path came from and how the reference groups were verified.

# 1029 subject IDs in strictly ascending order. Group membership is defined by positions in
# this list. Do not substitute demogr/sub_list.txt: same IDs, age-sorted order.
subject_list: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/pFIC_input/DK68/sub_list.txt
n_subjects: 1029

# Half-open [start, stop) positions in subject_list (MATLAB rows 1-680, 681-860, 861-1029).
splits:
  train: [0, 680]
  val: [680, 860]
  test: [860, 1029]

# Sliding window within each split (Tianchu's HCP_group_mats_bootstrap.m).
group_size: 50
group_stride: 10

# Subject level: {id}.csv for SC; {id}_bld00{k}.csv, k = 1..4, for run FC and FCD CDF.
subject_sc_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/SC/DK68
run_fc_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/FC/DK68
run_fcd_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/FCD_cdf/DK68

# Saved reference groups: {split}{index}.csv, e.g. train0.csv ... test12.csv.
reference_sc_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/SC/DK68/group_dl_ds
reference_fc_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/FC/DK68/group_dl_ds
reference_fcd_dir: /home/ftian/storage/projects/lifespan_EI/data/HCP-YA/FCD_cdf/DK68/group_dl_ds
